name: Manter o Supabase acordado

# O plano free do Supabase PAUSA o projeto depois de ~1 semana sem atividade no banco. Os dados não
# se perdem, mas a conta na nuvem para de responder até alguém clicar em "Restore" no painel — e o
# jogo cai para o modo offline sem avisar ninguém.
#
# Qualquer acesso ao banco zera essa contagem. Duas vezes por semana é folga suficiente para a
# janela de 7 dias, e é uma requisição por vez: nada que pese em nenhum dos dois lados.
#
# Quando o jogo tiver jogadores, isto vira redundância — eles mesmos mantêm o projeto acordado.
#
# ⚠️ O GitHub desliga workflows agendados em repositório sem commits por 60 dias. Se o projeto ficar
# parado tanto tempo, este aqui para junto, e aí a pausa do Supabase acontece mesmo.

on:
  schedule:
    # Segundas e quintas, 12:00 UTC (09:00 em Recife).
    - cron: "0 12 * * 1,4"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Tocar no banco
        env:
          URL: ${{ vars.VITE_SUPABASE_URL }}
          KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY || vars.VITE_SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$URL" ] || [ -z "$KEY" ]; then
            echo "Sem VITE_SUPABASE_URL/VITE_SUPABASE_PUBLISHABLE_KEY: não há nuvem para manter acordada."
            exit 0
          fi
          # A consulta passa pelo PostgREST e chega no Postgres, que é o que conta como atividade.
          # A RLS garante que ela não devolve linha nenhuma — o objetivo é o acesso, não o dado.
          code=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "apikey: $KEY" -H "Authorization: Bearer $KEY" \
            "$URL/rest/v1/profiles?select=id&limit=1")
          echo "O Supabase respondeu $code."
          # 200 = acordado. 401/403 = acordado e recusando, que também serve.
          case "$code" in
            200|401|403) exit 0 ;;
            *) echo "::warning::Resposta inesperada ($code) — o projeto pode estar pausado."; exit 0 ;;
          esac
